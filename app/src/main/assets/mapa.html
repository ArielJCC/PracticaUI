
<!DOCTYPE html>
<html>
<head>
    <title>Mapa de Usuarios</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div id="map"></div>

<script>
    var map = L.map('map').setView([0, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    function cargarUsuariosDesdeAndroid(jsonString) {
        try {
            console.log("✅ Función recibida, JSON:");
            console.log(jsonString);
            var usuarios = JSON.parse(jsonString);
            var bounds = [];

            usuarios.forEach(function(usuario) {
                if (usuario.latitud && usuario.longitud) {
                    var marker = L.marker([usuario.latitud, usuario.longitud]).addTo(map);
                    marker.bindPopup(`<b>${usuario.nombre}</b><br>${usuario.pais || ''}`);
                    bounds.push([usuario.latitud, usuario.longitud]);
                }
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [30, 30] });
            }
        } catch (e) {
            console.error("Error al procesar los datos:", e);
        }
    }
</script>
</body>
</html>
